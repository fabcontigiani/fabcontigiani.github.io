<section class="post">
  <header>
    <h1>{{title}}</h1>
    <p>
      <time class="post-date">📅 {{date}}</time>
      <span class="reading-time">⏱️ {{reading-time}}</span>
    </p>
    <div class="grimoire-tags">{{tags}}</div>
  </header>
  <div class="content">
    {{content}}
  </div>
</section>

<section class="comments">
<script src="https://giscus.app/client.js"
        data-repo="fabcontigiani/fabcontigiani.github.io"
        data-repo-id="R_kgDOSAzSQg"
        data-category="Posts"
        data-category-id="DIC_kwDOSAzSQs4C6sfG"
        data-mapping="title"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="en"
        crossorigin="anonymous"
        async>
</script>
</section>
