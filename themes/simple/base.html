<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <meta name="author" content="{{author}}">
  <title>{{title}} &mdash; {{site-title}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍💻</text></svg>">
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="{{site-title}}" href="{{base-url}}/rss.xml">
  <link rel="canonical" href="{{base-url}}{{url}}">
</head>

<body>
  {{include partials/navbar.html}}
  <main>
    {{content}}
  </main>
  {{include partials/footer.html}}
  <script>
    // Highlight current navbar link
    document.querySelectorAll('nav a').forEach(link => {
      const href = link.getAttribute('href');
      const path = window.location.pathname;
      
      if (path === href || 
          path === href + 'index.html' || 
          (href !== '/' && path.startsWith(href))) {
        link.classList.add('current');
      }
    });

    // Copy button logic
    document.querySelectorAll('.org-src-container').forEach(block => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copy';
      block.appendChild(btn);
      btn.addEventListener('click', () => {
        const code = block.querySelector('pre').innerText;
        navigator.clipboard.writeText(code).then(() => {
          btn.textContent = 'copied';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = 'copy';
            btn.classList.remove('copied');
          }, 2000);
        });
      });
    });
  </script>

</body>

</html>
